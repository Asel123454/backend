services:
  - type: web
    name: craft-organic-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # db push держит схему БД в синхроне с schema.prisma на каждом деплое.
    # Без --accept-data-loss: если миграция требует потери данных, деплой
    # упадёт (а не молча удалит данные) — это сигнал сделать миграцию вручную.
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Заполни эти переменные в дашборде Render (Environment):
      - key: DATABASE_URL
        sync: false   # строка подключения из Neon
      - key: JWT_SECRET
        sync: false   # любой длинный секрет
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: FRONTEND_URL
        sync: false   # URL фронтенда на Vercel, напр. https://your-app.vercel.app
